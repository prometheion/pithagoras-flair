# Each extension's build, typecheck, unit tests and browser tests (Chromium, WebGL drawn in software), on every pull
# request and every push to main. The sample models the browser tests draw are fetched once and kept in the cache.
name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - uses: actions/cache@v4
        with:
          path: avatar/test/.models
          key: vrm-samples-${{ hashFiles('avatar/test/browser/fetch-models.ts') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
